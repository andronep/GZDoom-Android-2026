name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - feature/visthruwall-investigation

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/27.0.12077973

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK and NDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0 ndk;27.0.12077973'

      - name: Build native engine
        run: |
          chmod +x build_native.sh
          ./build_native.sh

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew :doom:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VisThruWall-Android-Test
          path: doom/build/outputs/apk/debug/*.apk
          if-no-files-found: error
